services:
  snc-biometrics-v3:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped
    ports:
      - "${PORT:-3008}:3008"

    environment:
      NODE_ENV: production
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3008
      BASE_URL: ${BASE_URL}
      ZKTECO_IP: ${ZKTECO_IP}
      ZKTECO_PORT: ${ZKTECO_PORT}
      DATABASE_URL: ${DATABASE_URL}
      DB_HOST: host.docker.internal
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      TZ: Asia/Manila

    extra_hosts:
      - "host.docker.internal:host-gateway"